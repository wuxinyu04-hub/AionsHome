<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音乐</title>
<link rel="stylesheet" href="/static/common.css">
<style>
/* ── 奶油主题令牌（Figma cream 设计稿） ── */
:root {
  --bg:#fffdf8; --card:#fffdf2; --card-border:#ffece6; --nav-bg:#fff5ea;
  --btn-bg:#fff0ee; --t1:#4e3e3d; --t2:#8a7675; --t3:#b8a7a5;
  --accent:#ff9b98; --accent-link:#e0b392; --white:#ffffff;
  --shadow:0 8px 12px rgba(143,125,123,0.06);
  --serif:'Georgia','Songti SC','Noto Serif SC','SimSun',serif;
  /* 主题化色板（暗色在下方 body.music-page[data-theme="dark"] 覆盖） */
  --on-accent:#ffffff; --ring:#ffffff; --track:#e8dcd5;
  --mask:rgba(78,62,61,.35); --toast-bg:rgba(78,62,61,.9);
  --ph-a:#ffe9e4; --ph-b:#ffd9d4;
  --fav-a:#fff0ee; --fav-b:#ffe3de;
  --favc-a:#ffd9d4; --favc-b:#ffc4c0;
  --room-a:#fff3ef; --room-b:#ffe8e5;
  --fp-a:#fffdf9; --fp-b:#ffedec; --fp-c:#ffe8e5;
  --lyric-bg:rgba(255,253,248,.98); --whisper-bg:rgba(255,255,255,.75);
  --moon:#ffd9b8;
}
/* ── 暗色（跟随主页 aion_chat_theme：夜色蓝 + 保留粉调 accent）
   必须带 .music-page 提权：theme.js 把 theme.css 追加到 head（在本 style 之后），
   它的 body[data-theme="dark"] 同权重后来者胜，会把 --bg/--accent 改成全站紫蓝色。 ── */
body.music-page[data-theme="dark"] {
  --bg:#06091f; --card:#0d1330; --card-border:rgba(141,151,255,.20); --nav-bg:#111838;
  --btn-bg:rgba(141,151,255,.14); --t1:#f2f4ff; --t2:#b3badf; --t3:#8087b0;
  --accent:#ff9b98; --accent-link:#e3bb95; --white:#101731;
  --shadow:0 8px 20px rgba(0,0,0,.42);
  --on-accent:#2a1620; --ring:rgba(255,255,255,.22); --track:rgba(160,170,230,.24);
  --mask:rgba(2,5,20,.62); --toast-bg:rgba(20,26,56,.94);
  --ph-a:#1a2148; --ph-b:#141a3a;
  --fav-a:#18203f; --fav-b:#131933;
  --favc-a:#7d4a5c; --favc-b:#5c3247;
  --room-a:#141b3c; --room-b:#0d1330;
  --fp-a:#080d26; --fp-b:#0f1533; --fp-c:#161b3c;
  --lyric-bg:rgba(6,9,31,.97); --whisper-bg:rgba(30,38,74,.72);
  --moon:#d8c39a;
}
/* theme.css 的全站暗色规则会撞本页三个类，压回本页自己的令牌 */
body.music-page[data-theme="dark"] .top-bar { background:transparent; border-color:transparent; color:var(--t1); }
body.music-page[data-theme="dark"] .icon-btn { background:none; color:var(--t1); }
body.music-page[data-theme="dark"] .toast { background:var(--toast-bg); color:#fff; border:1px solid var(--card-border); }
body.music-page[data-theme="dark"] { background:var(--bg); color:var(--t1); }
* { -webkit-tap-highlight-color:transparent; }
.music-app { display:flex; flex-direction:column; height:100%; background:var(--bg); color:var(--t1); overflow:hidden; position:relative; }
.music-app > * { position:relative; z-index:1; }
.hidden { display:none !important; }
.empty-hint { color:var(--t3); font-size:13px; text-align:center; padding:30px 16px; line-height:1.6; }
/* ── 顶栏 ── */
.top-bar { display:flex; align-items:center; gap:10px; padding:10px 14px 4px; background:transparent; }
.top-bar .back-btn { color:var(--t1); }
.top-bar .title { flex:1; font-size:18px; font-weight:800; color:var(--t1); letter-spacing:.5px; }
.top-bar .icon-btn { background:none; border:none; color:var(--t1); font-size:18px; cursor:pointer; padding:5px; }
/* ── 底部导航（奶油悬浮栏） ── */
.tabs { position:absolute; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); z-index:7; display:flex; justify-content:space-around; background:var(--nav-bg); border:1px solid var(--card-border); border-radius:22px; padding:6px 8px; box-shadow:var(--shadow); }
.tab { background:none; border:none; flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:var(--t3); cursor:pointer; padding:3px 0; border-radius:16px; transition:color .2s; }
.tab svg { width:22px; height:22px; }
.tab.active { color:var(--accent); font-weight:700; }
/* ── 面板滚动区 ── */
.panels { flex:1; min-height:0; overflow-y:auto; padding:4px 16px 150px; background:var(--bg); scrollbar-width:none; }
.panels::-webkit-scrollbar { display:none; }
.panel.hidden { display:none; }
.section-title { font-size:16px; font-weight:800; color:var(--t1); display:flex; align-items:center; gap:6px; margin:18px 2px 10px; }
.section-title .cnt-note { font-size:11px; color:var(--t3); font-weight:500; }
.section-row { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px; }
.section-row .section-title { margin:0; }
.shuffle-link { background:var(--btn-bg); border:none; color:var(--accent); font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer; }
.shuffle-link:active { transform:scale(.96); }
/* ── 问候气泡 ── */
.greet-bubble { background:var(--card); border:1px solid var(--card-border); border-radius:18px 18px 4px 18px; padding:16px 16px 13px; margin:8px 0 12px; box-shadow:var(--shadow); }
.greet-bubble .gb-tx { font-family:var(--serif); font-style:italic; font-size:17px; color:var(--t1); line-height:1.55; }
.greet-bubble .gb-sig { margin-top:8px; font-size:11px; color:var(--accent-link); font-weight:600; text-align:right; }
/* ── 搜索 ── */
.search-input { width:100%; box-sizing:border-box; padding:11px 18px; border:1px solid var(--card-border); border-radius:999px; background:var(--card); color:var(--t1); font-size:14px; margin-bottom:14px; box-shadow:var(--shadow); }
.search-input:focus { outline:none; border-color:var(--accent); }
.search-input::placeholder { color:var(--t3); }
/* ── 歌曲行 ── */
.song-row { display:flex; align-items:center; gap:11px; padding:8px 6px; border-radius:12px; cursor:pointer; }
.song-row:active { background:var(--btn-bg); }
.song-row.cur .name { color:var(--accent); }
.song-row .cover { width:46px; height:46px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--nav-bg); }
.song-row .info { flex:1; min-width:0; }
.song-row .name { font-size:14.5px; color:var(--t1); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-row .artist { font-size:11.5px; color:var(--t2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song-row .btn { background:none; border:none; font-size:16px; color:var(--t3); cursor:pointer; padding:6px 5px; flex-shrink:0; }
.song-row .btn:active { color:var(--accent); }
.song-row .like.liked { color:var(--accent); }
.song-row .note { font-size:11px; color:var(--accent); opacity:.85; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* ── 首页：他想放给你听 ── */
.rec-cards { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
.rec-card { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:10px; cursor:pointer; box-shadow:var(--shadow); }
.rec-card:active { transform:scale(.985); }
.rec-cover { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; background:var(--nav-bg); display:block; }
.rec-coverph { width:100%; aspect-ratio:1; border-radius:12px; background:linear-gradient(150deg,var(--ph-a),var(--ph-b)); display:grid; place-items:center; font-size:26px; color:rgba(255,155,152,.75); }
.rec-name { font-size:13px; font-weight:700; color:var(--t1); margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rec-note { font-family:var(--serif); font-style:italic; font-size:11px; color:var(--accent-link); margin-top:3px; line-height:1.4; max-height:30px; overflow:hidden; }
/* ── 首页：我们的歌 ── */
.our-row { display:flex; align-items:center; gap:11px; padding:9px 6px; border-radius:14px; cursor:pointer; background:var(--card); border:1px solid var(--card-border); margin-bottom:8px; box-shadow:var(--shadow); }
.our-row:active { transform:scale(.985); }
.our-idx { width:26px; height:26px; border-radius:8px; background:var(--nav-bg); color:var(--accent-link); font-weight:800; font-size:13px; display:grid; place-items:center; flex-shrink:0; }
.our-cover { width:44px; height:44px; border-radius:10px; object-fit:cover; background:var(--nav-bg); flex-shrink:0; }
.our-info { flex:1; min-width:0; }
.our-name { font-size:14.5px; font-weight:700; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.our-sub { font-size:11px; color:var(--t2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.our-cnt { font-size:12px; color:var(--accent); font-weight:700; flex-shrink:0; }
/* ── 歌单页 ── */
.pl-note { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:13px 14px; margin:6px 0 4px; box-shadow:var(--shadow); }
.pl-note img { width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0; border:1.5px solid var(--card-border); }
.pl-note .txt { font-size:13px; color:var(--t1); line-height:1.55; }
.pl-note .txt b { display:block; }
.pl-note-sub { font-family:var(--serif); font-style:italic; font-size:12px; color:var(--t2); margin-top:2px; }
.pill-btns { display:flex; gap:8px; }
.pill { background:var(--btn-bg); border:none; color:var(--accent); font-size:12px; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer; }
.pill:active { transform:scale(.96); }
.fav-card { display:flex; align-items:center; gap:13px; margin:2px 0 10px; padding:13px; border-radius:16px; background:linear-gradient(120deg,var(--fav-a),var(--fav-b) 80%); color:var(--t1); border:1px solid var(--card-border); cursor:pointer; box-shadow:var(--shadow); }
.fav-cover { width:52px; height:52px; border-radius:12px; display:grid; place-items:center; font-size:22px; background:linear-gradient(150deg,var(--favc-a),var(--favc-b)); color:#fff; flex-shrink:0; }
.fav-card img { width:52px; height:52px; border-radius:12px; object-fit:cover; background:rgba(255,155,152,.15); }
.fav-card .fi { flex:1; min-width:0; }
.fav-card .fn { font-size:15px; font-weight:800; }
.fav-card .fc { font-size:11.5px; color:var(--accent); margin-top:3px; }
.fav-card .fav-play { width:38px; height:38px; border-radius:50%; border:none; background:var(--white); color:var(--accent); font-size:14px; cursor:pointer; display:grid; place-items:center; box-shadow:0 4px 12px rgba(255,155,152,.35); flex-shrink:0; }
.pl-card-row { display:flex; align-items:center; gap:12px; padding:9px 8px; border-radius:14px; background:var(--card); border:1px solid var(--card-border); box-shadow:var(--shadow); margin-bottom:9px; cursor:pointer; }
.pl-card-row:active { transform:scale(.985); }
.plc-cover { width:58px; height:58px; border-radius:12px; object-fit:cover; flex-shrink:0; background:var(--nav-bg); }
.plc-info { flex:1; min-width:0; }
.plc-name { font-size:14.5px; font-weight:700; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.plc-note { font-family:var(--serif); font-style:italic; font-size:11.5px; color:var(--accent-link); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.plc-meta { font-size:11px; color:var(--t2); margin-top:2px; }
.plc-play { width:34px; height:34px; border-radius:50%; background:var(--btn-bg); color:var(--accent); font-size:13px; display:grid; place-items:center; flex-shrink:0; }
.pl-back { font-size:14px; color:var(--t2); cursor:pointer; padding:10px 2px; }
.pl-back:active { color:var(--accent); }
.pl-allbtns { display:flex; gap:10px; margin:6px 0 12px; }
.pl-allbtns button { flex:1; padding:11px; border:none; border-radius:999px; background:var(--btn-bg); color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; }
.pl-allbtns button:first-child { background:var(--accent); color:var(--on-accent); box-shadow:0 6px 16px rgba(255,155,152,.4); }
.pl-head { display:flex; align-items:center; gap:13px; margin:2px 0 10px; }
.pl-head-cover { width:64px; height:64px; border-radius:14px; object-fit:cover; background:var(--nav-bg); }
.pl-head-tx { flex:1; min-width:0; }
.pl-head-name { font-size:17px; font-weight:800; color:var(--t1); }
.pl-head-meta { font-size:11.5px; color:var(--t2); margin-top:3px; }
.pl-tag { font-size:10px; background:var(--btn-bg); color:var(--accent); padding:1.5px 7px; border-radius:8px; margin-left:5px; vertical-align:middle; font-weight:600; }
.pl-tag.ai { background:var(--accent); color:var(--on-accent); }
/* ── 回忆页 ── */
.mem-head { padding:16px 2px 4px; }
.mem-title { font-family:var(--serif); font-size:28px; font-weight:700; color:var(--t1); }
.mem-sub { font-size:12px; color:var(--t2); margin-top:6px; line-height:1.5; }
.timeline-day { position:relative; padding-left:18px; margin:14px 0 6px; }
.timeline-day::before { content:''; position:absolute; left:5px; top:18px; bottom:-8px; width:2px; background:var(--card-border); }
.tl-dot { position:absolute; left:0; top:6px; width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--btn-bg); }
.tl-date { font-family:var(--serif); font-style:italic; font-size:14px; color:var(--accent-link); font-weight:700; margin:0 0 8px; }
.mem-card { background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:11px 13px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow); }
.mem-card:active { transform:scale(.985); }
.mem-top { display:flex; align-items:center; gap:11px; }
.mem-cover { width:46px; height:46px; border-radius:10px; object-fit:cover; background:var(--nav-bg); flex-shrink:0; }
.mem-tx { flex:1; min-width:0; }
.mem-name { font-size:14px; font-weight:700; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mem-tag { font-size:10.5px; color:var(--t2); margin-top:2px; }
.mem-div { height:1px; background:var(--card-border); margin:9px 0 8px; }
.mem-sig { font-size:11px; color:var(--accent-link); font-weight:700; margin-bottom:4px; }
.mem-note { font-family:var(--serif); font-style:italic; font-size:12.5px; color:var(--t1); line-height:1.6; }
/* ── 我们页 ── */
.room-card { background:var(--card); border:1px solid var(--card-border); border-radius:20px; padding:14px 16px 18px; margin:8px 0 4px; box-shadow:var(--shadow); }
.room-scene { position:relative; height:110px; border-radius:14px; background:linear-gradient(160deg,var(--room-a),var(--room-b) 70%); overflow:hidden; }
.rs-moon { position:absolute; right:22px; top:16px; width:34px; height:34px; border-radius:50%; background:var(--moon); box-shadow:0 0 24px rgba(255,180,120,.7); }
.rs-note { position:absolute; font-size:22px; color:rgba(255,155,152,.6); }
.rs-note.n1 { left:30px; top:24px; }
.rs-note.n2 { left:70px; bottom:18px; font-size:28px; }
.rs-note.n3 { left:120px; top:14px; font-size:18px; }
.rs-ai { position:absolute; right:26px; bottom:12px; width:44px; height:44px; border-radius:50%; object-fit:cover; border:3px solid var(--ring); box-shadow:0 6px 16px rgba(255,155,152,.5); }
.room-title { font-size:16px; font-weight:800; color:var(--t1); margin-top:13px; }
.room-quote { font-family:var(--serif); font-style:italic; font-size:13px; color:var(--t2); line-height:1.7; margin-top:8px; }
.room-sig { text-align:right; font-size:11px; color:var(--accent-link); margin-top:6px; font-weight:700; }
.space-intim { display:flex; flex-direction:column; align-items:center; padding:22px 16px 18px; background:var(--card); border:1px solid var(--card-border); border-radius:20px; margin:12px 0 4px; box-shadow:var(--shadow); }
.intim-avatars { display:flex; align-items:center; }
.intim-avatars img { width:58px; height:58px; border-radius:50%; object-fit:cover; border:3px solid var(--ring); box-shadow:0 4px 14px rgba(143,125,123,.2); background:var(--nav-bg); }
.intim-avatars img:first-child { margin-right:-10px; }
.intim-avatars img:last-child { margin-left:-10px; }
.intim-heart { position:relative; z-index:2; width:30px; height:30px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:14px; box-shadow:0 4px 12px rgba(255,155,152,.5); animation:cpPulse 1.6s ease-in-out infinite; }
.intim-title { font-size:20px; font-weight:900; color:var(--t1); margin-top:13px; }
.intim-sub { font-size:12px; color:var(--t2); margin-top:5px; text-align:center; line-height:1.5; }
.frame-card { background:var(--card); border:1px solid var(--card-border); border-radius:18px; padding:14px; cursor:pointer; box-shadow:var(--shadow); }
.frame-card:active { transform:scale(.985); }
.frame-inner { display:flex; flex-direction:column; align-items:center; padding:18px 14px; border-radius:12px; background:var(--nav-bg); }
.frame-cover { width:140px; height:140px; border-radius:10px; object-fit:cover; box-shadow:0 8px 22px rgba(143,125,123,.22); background:var(--nav-bg); }
.frame-name { font-size:15px; font-weight:800; color:var(--t1); margin-top:14px; }
.frame-sub { font-size:11px; color:var(--accent-link); margin-top:5px; }
/* ── 队列底部抽屉 ── */
.q-sheet { position:fixed; inset:0; z-index:60; display:none; }
.q-sheet.show { display:block; }
.q-mask { position:absolute; inset:0; background:var(--mask); }
.q-panel { position:absolute; left:0; right:0; bottom:0; max-height:66%; min-height:200px; background:var(--white); border-radius:20px 20px 0 0; display:flex; flex-direction:column; padding:16px 16px 18px; animation:qUp .25s ease; box-shadow:0 -8px 30px rgba(143,125,123,.2); }
@keyframes qUp { from { transform:translateY(40px); opacity:.5; } to { transform:none; opacity:1; } }
.q-head { display:flex; align-items:center; justify-content:space-between; padding:0 4px 10px; }
.q-head span { font-size:16px; font-weight:800; color:var(--t1); }
.q-clear { background:none; border:none; color:var(--t2); font-size:13px; cursor:pointer; padding:4px 6px; }
.q-clear:active { color:var(--accent); }
.q-list { flex:1; min-height:0; overflow-y:auto; }
/* ── 迷你播放条（奶油白卡 + 粉色进度线） ── */
.mini-player { position:absolute; left:12px; right:12px; bottom:calc(88px + env(safe-area-inset-bottom,0px)); height:62px; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--white); border:1px solid var(--card-border); border-radius:18px; box-shadow:0 10px 26px rgba(143,125,123,.14); cursor:pointer; z-index:5; overflow:hidden; }
.mini-player .mc { width:44px; height:44px; border-radius:11px; object-fit:cover; flex-shrink:0; background:var(--nav-bg); overflow:hidden; }
.mini-player .mc.spin { animation:mcGlow 2.4s ease-in-out infinite; }
@keyframes mcGlow { 0%,100%{ box-shadow:0 0 0 0 rgba(255,155,152,0);} 50%{ box-shadow:0 0 0 5px rgba(255,155,152,.2);} }
.mini-player .mc.empty { display:grid; place-items:center; font-size:17px; color:var(--t3); }
.mini-player .mi { flex:1; min-width:0; }
.mini-player .mt { font-size:13.5px; color:var(--t1); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini-player .ma { font-size:11px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mini-player .mb { background:none; border:none; font-size:18px; color:var(--accent); cursor:pointer; padding:8px 5px; flex-shrink:0; }
.mini-player .mprog { position:absolute; left:0; right:0; bottom:0; height:3px; background:transparent; border-radius:2px; overflow:hidden; }
.mini-player .mprog .mfill { height:100%; width:0; background:var(--accent); transition:width .2s linear; border-radius:2px; }
.mini-player.hidden { display:none; }
/* ── 全屏播放器（奶油房渐变） ── */
.full-player { position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,var(--fp-a) 0%,var(--fp-b) 55%,var(--fp-c) 100%); display:none; flex-direction:column; }
.full-player.show { display:flex; }
.fp-bg { position:absolute; inset:0; background-size:cover; background-position:center; filter:blur(60px) saturate(1.3); opacity:.28; transform:scale(1.2); }

<script src="/static/common.js"></script>
<script>
/* ── 音乐：奶油房。自带播放器，不依赖父页 ──
   自己的 <audio> + 队列（localStorage 共享，AI 在聊天页点的歌也会进来）。
   播放时暂停父页音频避免双声。离开本页音频停。
   与聊天页播放条联动：本页播放=抢 leader，父页 bar 镜像；父页播放=本页镜像；
   关闭音乐子页时把播放权交回父页 bar（handoff），音乐不断。
   $ / api / escHtml 由 common.js 提供。 */
const QKEY = 'aion_music_queue_v1', SKEY = 'aion_music_state_v1';
let queue = [], index = -1, repeat = 'off', shuffle = false;
let audio = null, lastCover = null, fullOpen = false, lyricsOpen = false, curTab = 'home';
let lyricsData = [], lyricsIdx = -1, lastSongId = null;
const likedIds = new Set(), songIdx = {};
let cpSongId = null, cpComment = '', cpTimer = null, cpHideTimer = null;  // 驻场评论状态
let aiPlRegistry = [];  // TA 建的歌单登记簿
let aiName = '温叙远', userName = '小语';  // 从 worldbook 动态读取

function loadState() {
  try { queue = JSON.parse(localStorage.getItem(QKEY) || '[]') || []; } catch(e){ queue = []; }
  try { const st = JSON.parse(localStorage.getItem(SKEY) || '{}') || {}; repeat = st.repeat || 'off'; shuffle = !!st.shuffle; index = (typeof st.index === 'number' && st.index < queue.length) ? st.index : -1; } catch(e){}
}
function saveQueue() { try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch(e){} }
function saveState() { try { localStorage.setItem(SKEY, JSON.stringify({repeat, shuffle, index})); } catch(e){} }
function current() { return (index >= 0 && index < queue.length) ? queue[index] : null; }
function fmt(s) { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtDate(ts) { if (!ts) return ''; const d = new Date(Math.round(Number(ts)||0)*1000); if (isNaN(d.getTime())) return ''; const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate()); }

function ensureAudio() {
  if (audio) return;
  audio = document.createElement('audio');
  audio.volume = (parseInt(localStorage.getItem('musicVolume') ?? '50'))/100;
  audio.addEventListener('timeupdate', onTick);
  audio.addEventListener('play', () => { updatePlayBtns(); musBroadcastState(); });
  audio.addEventListener('pause', () => { updatePlayBtns(); musBroadcastState(); });
  audio.addEventListener('ended', onNext);
}
function pauseParentAudio() { try { window.parent.document.getElementById('globalMusicAudio')?.pause(); } catch(e){} }

function playIndex(i, autoplay) {
  ensureAudio();
  if (i < 0 || i >= queue.length) return;
  pauseParentAudio();
  musClaimLeader();
  index = i; saveState();
  const song = queue[i];
  audio.src = '/api/music/stream/' + song.id;
  renderNowPlaying(song);
  if (autoplay) audio.play().catch(()=>{});
  reportNowPlaying();
}
function playNow(song) {
  if (!song || song.id == null) return;
  songIdx[song.id] = song;
  let i = queue.findIndex(q => q.id === song.id);
  if (i < 0) { queue.push(song); i = queue.length - 1; saveQueue(); }
  playIndex(i, true);
}
function enqueue(songs, opts) {
  opts = opts || {};
  const list = Array.isArray(songs) ? songs : [songs];
  list.forEach(s => { if (s && s.id != null) { songIdx[s.id] = s; if (!queue.some(q => q.id === s.id)) queue.push(s); } });
  saveQueue();
  if (opts.play && list.length) { const t = list[0]; const i = queue.findIndex(q => q.id === t.id); if (i >= 0) playIndex(i, true); }
  else renderNowPlaying();
  if (qSheetOpen()) renderQueue();
}
function togglePlay() {
  ensureAudio();
  if (!musIsLeader) {
    // 本页不是 leader（可能在镜像父页正播的歌）：接管播放权续播
    let tgt = null, ti = -1;
    if (musMirror && musMirror.songId != null) {
      if (Array.isArray(musMirror.queue) && musMirror.queue.length) {
        const qi = musMirror.queue.findIndex(q => q.id === musMirror.songId);
        if (qi >= 0) { tgt = musMirror.queue[qi]; ti = qi; }
      }
      if (!tgt) tgt = { id: musMirror.songId, name: musMirror.name, artist: musMirror.artist, cover: musMirror.cover };
    }
    if (!tgt && audio && audio.src && current()) { tgt = current(); ti = index; }
    if (!tgt && queue.length) { ti = (index >= 0 && index < queue.length) ? index : 0; tgt = queue[ti]; }
    if (!tgt) return;
    const pos = musMirror ? (musMirrorPos || musMirror.position || 0) : (audio && audio.src ? (audio.currentTime || 0) : 0);
    playIndex(ti, true);   // playIndex 内部 claim leader，父页 bar 会镜像并让权
    if (pos > 0) {
      const _a = audio;
      const _seek = () => { try { if (_a && _a.src && _a.duration) _a.currentTime = pos; } catch(e){} };
      if (_a.readyState >= 1) _seek(); else _a.addEventListener('loadedmetadata', _seek, { once: true });
    }
    return;
  }
  if (!audio.src) { if (queue.length) playIndex(index >= 0 ? index : 0, true); return; }
  if (audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function onNext() {
  if (!queue.length) return;
  if (repeat === 'one') { audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  let i = shuffle ? (queue.length === 1 ? 0 : (() => { let n; do { n = Math.floor(Math.random()*queue.length); } while (n === index); return n; })()) : index + 1;
  if (i >= queue.length) { if (repeat === 'all') i = 0; else { index = -1; audio.src = ''; saveState(); renderNowPlaying(); musRelease(); return; } }
  playIndex(i, true);
}
function onPrev() { if (!queue.length) return; if (audio && audio.currentTime > 3) { audio.currentTime = 0; return; } let i = index - 1; if (i < 0) i = repeat === 'all' ? queue.length - 1 : 0; playIndex(i, true); }
function toggleRepeat() { repeat = repeat === 'off' ? 'all' : (repeat === 'all' ? 'one' : 'off'); saveState(); renderNowPlaying(); }
function toggleShuffle() { shuffle = !shuffle; saveState(); renderNowPlaying(); }
function removeFromQueue(i) {
  if (i < 0 || i >= queue.length) return;
  const wasCur = i === index;
  queue.splice(i, 1);
  if (i < index) index--; else if (i === index) index = Math.min(index, queue.length - 1);
  saveQueue();
  if (wasCur && queue.length) playIndex(Math.max(0, index), true);
  else if (!queue.length) { ensureAudio(); audio.pause(); audio.src = ''; index = -1; saveState(); renderNowPlaying(); }
  renderQueue();
}
function clearQueue() {
  if (!queue.length && index < 0) return;
  queue = []; index = -1; ensureAudio(); audio.pause(); audio.src = ''; saveQueue(); saveState();
  musRelease();
  reportNowPlaying(true);
  renderNowPlaying(); renderQueue();
}
let _reportTs = 0;
function reportNowPlaying(clear) {
  const cur = current();
  if (clear || !cur) { api('POST', '/api/music/now_playing', { song_id: null }).catch(()=>{}); return; }
  const now = Date.now();
  if (now - _reportTs < 3000) return; _reportTs = now;
  api('POST', '/api/music/now_playing', { song_id: cur.id, name: cur.name, artist: cur.artist, cover: cur.cover || '', state: (audio && !audio.paused) ? 'playing' : 'paused', position: (audio && audio.currentTime) || 0, queue_count: queue.length }).catch(()=>{});
}

async function loadWorldbook() {
  try { const wb = await api('GET', '/api/worldbook'); if (wb && wb.ai_name) aiName = wb.ai_name; if (wb && wb.user_name) userName = wb.user_name; } catch(e){}
  $('fpHeadTitle').textContent = '正在与' + aiName + '共听';
  $('fpAiName').textContent = aiName;
  $('fpArtist').textContent = aiName + ' • 心跳电台';
}

/* ── 与聊天页播放条联动：加入 aion-music 频道，leader 播→父页 bar 镜像；父页 leader→本页镜像 ── */
const MUSIC_LEADER_KEY = 'aion_music_leader_v1';
let musBC = null, musIsLeader = false, musMirror = null;
let musTabId = 'mus_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
let musMirrorPos = 0, musMirrorAt = 0, _musBcTs = 0, _musHbTs = 0;

function musReadLeader() { try { const l = JSON.parse(localStorage.getItem(MUSIC_LEADER_KEY) || 'null'); if (!l) return null; if (Date.now() - l.ts > 10000) return null; return l; } catch(e){ return null; } }
function musBroadcast(m) { try { m.tabId = musTabId; musBC && musBC.postMessage(m); } catch(e){} }
function musClaimLeader() {
  musIsLeader = true;
  musMirror = null;
  try { localStorage.setItem(MUSIC_LEADER_KEY, JSON.stringify({ tabId: musTabId, ts: Date.now() })); } catch(e){}
  musBroadcast({ type: 'leader_claim' });
}
function musRelease() {
  if (!musIsLeader) return;
  musIsLeader = false;
  try { localStorage.removeItem(MUSIC_LEADER_KEY); } catch(e){}
  musBroadcast({ type: 'leader_release' });
}
function musDemote() {
  if (!musIsLeader) return;
  musIsLeader = false;
  if (audio) { try { audio.pause(); } catch(e){} }
}
function musBroadcastState() {
  if (!musIsLeader) return;
  const cur = current();
  musBroadcast({ type: 'state', leader: musTabId, songId: cur ? cur.id : null, name: cur ? cur.name : null, artist: cur ? cur.artist : null, cover: cur ? cur.cover : null, paused: audio ? audio.paused : true, position: audio ? (audio.currentTime || 0) : 0, duration: audio ? (audio.duration || 0) : 0, queue: queue, index: index });
}
function musOnMsg(m) {
  if (!m || !m.type || m.tabId === musTabId) return;
  if (m.type === 'leader_claim') {
    if (musIsLeader) musDemote();
  } else if (m.type === 'state') {
    if (musIsLeader) return;
    musMirror = { songId: m.songId, name: m.name, artist: m.artist, cover: m.cover, paused: m.paused, position: m.position || 0, duration: m.duration || 0, queue: m.queue, index: m.index, leader: m.tabId };
    musMirrorPos = musMirror.position; musMirrorAt = Date.now();
    if (Array.isArray(m.queue) && m.queue.length) {
      queue = m.queue; saveQueue();
      m.queue.forEach(s => { if (s && s.id != null) songIdx[s.id] = s; });
      if (typeof m.index === 'number') { index = m.index; saveState(); }
    }
    renderNowPlaying(); updatePlayBtns();
  } else if (m.type === 'request_play') {
    if (musIsLeader && m.song && m.song.id != null) playNow(m.song);
  } else if (m.type === 'close') {
    musMirror = null;
    if (musIsLeader) { if (audio) { try { audio.pause(); } catch(e){} audio.src = ''; } index = -1; saveState(); musRelease(); }
    else if (audio && audio.src) { try { audio.pause(); } catch(e){} audio.src = ''; }
    renderNowPlaying(); updatePlayBtns();
  } else if (m.type === 'leader_release') {
    if (!musIsLeader && musMirror && musMirror.leader === m.tabId) { musMirror = null; renderNowPlaying(); updatePlayBtns(); }
  }
}
function musHeartbeat() {
  if (!musIsLeader) return;
  const now = Date.now();
  if (now - _musHbTs < 3000) return; _musHbTs = now;
  try { localStorage.setItem(MUSIC_LEADER_KEY, JSON.stringify({ tabId: musTabId, ts: now })); } catch(e){}
}
function musTickBroadcast() {
  if (!musIsLeader || !audio || audio.paused) return;
  const now = Date.now();
  if (now - _musBcTs < 4000) return; _musBcTs = now;
  musBroadcastState();
}
function musHandoff() {
  if (!musIsLeader || !audio || !audio.src) return;
  musBroadcast({ type: 'handoff', queue: queue, index: index, position: audio.currentTime || 0, songId: (current() || {}).id || null });
  if (audio) { try { audio.pause(); } catch(e){} }
  musRelease();
}
function musInit() {
  try { musBC = new BroadcastChannel('aion-music'); musBC.onmessage = e => musOnMsg(e.data); } catch(e){ musBC = null; }
  window.addEventListener('storage', e => {
    if (e.key !== MUSIC_LEADER_KEY) return;
    const lead = musReadLeader();
    if (musIsLeader && lead && lead.tabId !== musTabId) musDemote();
  });
  // 页面临走（刷新/直接导航）也把播放权交回父页，避免父页无主
  window.addEventListener('beforeunload', () => { if (musIsLeader) musHandoff(); });
  // 父页关闭音乐子页：handoff 给聊天页 bar，音乐不断
  window.addEventListener('message', e => { if (e.data && e.data.type === 'aionMusicSubpageClose') musHandoff(); });
}

function init() {
  musInit();
  loadState();
  $('miniPlayer').addEventListener('click', e => { if (e.target && e.target.id === 'mcPlay') return; openFullPlayer(); });
  $('mcPlay').onclick = e => { e.stopPropagation(); togglePlay(); };
  $('mcChevron').onclick = e => { e.stopPropagation(); openFullPlayer(); };
  $('fpDown').onclick = closeFullPlayer;
  $('fpPlay').onclick = togglePlay;
  $('fpPrev').onclick = onPrev;
  $('fpNext').onclick = onNext;
  $('fpShuffle').onclick = toggleShuffle;
  $('fpRepeat').onclick = toggleRepeat;
  $('fpLyricBtn').onclick = toggleLyrics;
  $('fpBar').oninput = e => { ensureAudio(); if (audio.duration) audio.currentTime = (e.target.value/1000)*audio.duration; };
  $('fpCover').onclick = toggleLyrics;
  $('topQueue').onclick = openQueueSheet;
  $('fpQueue').onclick = openQueueSheet;
  $('qMask').onclick = closeQueueSheet;

    if (e.target && e.target.classList && e.target.classList.contains('ll')) { seekLyric(parseInt(e.target.dataset.i)); return; }

  });
  const lbEl = $('lyricsBody');
  ['touchstart','mousedown'].forEach(ev => lbEl.addEventListener(ev, () => { lbEl._manual = Date.now(); }, { passive: true }));
  $('cpAvatar').onclick = onCompanionTap;

  // 独立打开本页（非 iframe）时 common.js 不绑返回键，兜底回主页
  const bb = document.querySelector('.top-bar .back-btn');
  if (bb && !bb.onclick) bb.onclick = () => { location.href = '/'; };
  // 监听 localStorage 跨标签/父页变化（AI 在聊天页点歌时同步队列）；正在搜索时不重刷主页
  window.addEventListener('storage', e => { if (e.key === QKEY) { const oldLen = queue.length; queue = readArr(QKEY); if (qSheetOpen()) renderQueue(); const hs = $('homeSearch'); if (curTab === 'home' && !(hs && hs.value)) renderHome(); renderNowPlaying(); } });
  renderNowPlaying();
  loadWorldbook().then(() => { if (curTab === 'home') renderHome(); });
  switchTab('home');
  api('GET', '/api/music/warm').catch(()=>{});  // 后台预热歌单/红心缓存
  requestAnimationFrame(loop);
}
function readArr(k) { try { return JSON.parse(localStorage.getItem(k) || '[]') || []; } catch(e){ return []; } }

function loop() {
  onTick();
  const cur = current();
  const id = cur ? cur.id : null;
  if (id !== lastSongId) { lastSongId = id; loadLyrics(cur); scheduleCompanion(cur); if (qSheetOpen()) renderQueue(); }
  if (audio && !audio.paused) { reportNowPlaying(); musTickBroadcast(); }
  musHeartbeat();
  requestAnimationFrame(loop);
}
function setCoverBg(url) { if (url === lastCover) return; lastCover = url; $('fpBg').style.backgroundImage = url ? `url("${url}")` : ''; }

function renderNowPlaying(cur) {
  cur = cur || current();
  const has = !!cur;
  $('miniPlayer').classList.toggle('hidden', !has);
  if (!has) return;
  const mc = $('mcCover');
  if (cur.cover) { mc.innerHTML = ''; mc.className = 'mc'; const img = new Image(); img.src = cur.cover; img.style.cssText = 'width:100%;height:100%;border-radius:11px;object-fit:cover;'; mc.appendChild(img); }
  else { mc.innerHTML = '🎵'; mc.className = 'mc empty'; }
  $('mcTitle').textContent = cur.name || '未知';
  $('mcArtist').textContent = cur.artist || '';
  $('fpCover').src = cur.cover || '';
  $('fpTitle').textContent = cur.name || '未知';
  $('fpArtist').textContent = cur.artist || (aiName + ' • 心跳电台');
  $('fpHeadTitle').textContent = '正在与' + aiName + '共听';
  $('fpShuffle').classList.toggle('active', shuffle);
  $('fpRepeat').classList.toggle('active', repeat !== 'off');
  $('fpRepeat').textContent = repeat === 'one' ? '🔂' : '🔁';
  setCoverBg(cur.cover);
}
function updatePlayBtns() {
  let p;
  if (musIsLeader || !musMirror) p = !!(audio && !audio.paused && audio.src);
  else p = !musMirror.paused;  // 镜像：跟随 leader 的播放状态
  $('mcPlay').textContent = p ? '⏸' : '▶'; $('fpPlay').textContent = p ? '⏸' : '▶'; $('fpCover').classList.toggle('playing', !!p); $('fpCouple').classList.toggle('on', !!p); $('mcCover').classList.toggle('spin', !!p); $('cpAvatar').classList.toggle('listening', !!p); }
function onTick() {
  let c, d;
  if (musIsLeader || !musMirror) {
    if (!audio) { $('mcFill').style.width = '0%'; return; }
    d = audio.duration || 0; c = audio.currentTime || 0;
  } else {
    // 镜像模式：按 leader 广播时间戳插值进度
    d = musMirror.duration || 0;
    c = musMirror.paused ? (musMirror.position || 0) : (musMirrorPos + (Date.now() - musMirrorAt) / 1000);
    if (d > 0 && c > d) c = d;
  }
  const pct = d ? c/d : 0;
  if (!$('fpBar').matches(':active')) $('fpBar').value = d ? pct*1000 : 0;
  $('mcFill').style.width = (pct*100) + '%';
  $('fpCur').textContent = fmt(c); $('fpDur').textContent = fmt(d);
  if (lyricsOpen && lyricsData.length) { let li = -1; for (let i = 0; i < lyricsData.length; i++) { if (lyricsData[i].t <= c + 0.2) li = i; else break; } if (li !== lyricsIdx && li >= 0) { lyricsIdx = li; scrollLyrics(li); } }
}
function openFullPlayer() {
  fullOpen = true; $('fullPlayer').classList.add('show'); renderNowPlaying(); buildLyrics();
  updateTodayCount();
}
function closeFullPlayer() { fullOpen = false; $('fullPlayer').classList.remove('show'); $('fpLyrics').classList.remove('show'); lyricsOpen = false; }
function toggleLyrics() { if (!lyricsData.length) return; lyricsOpen = !lyricsOpen; $('fpLyrics').classList.toggle('show', lyricsOpen); if (lyricsOpen) { const c0 = current(); if (c0) $('flTitle').textContent = c0.name || '歌词'; buildLyrics(); const c = (audio && audio.currentTime) || 0; let li = -1; for (let i = 0; i < lyricsData.length; i++) { if (lyricsData[i].t <= c + 0.2) li = i; else break; } if (li >= 0) scrollLyrics(li); } }
function closeLyrics() { $('fpLyrics').classList.remove('show'); lyricsOpen = false; }
function seekLyric(i) { const l = lyricsData[i]; if (!l) return; ensureAudio(); if (audio && audio.duration) audio.currentTime = l.t; }
async function loadLyrics(cur) { lyricsData = []; lyricsIdx = -1; if (!cur || !cur.id) return; if (cur.name) $('flTitle').textContent = cur.name; try { const res = await api('GET', '/api/music/lyrics/' + cur.id); lyricsData = (res && res.synced) || []; } catch(e){} if (lyricsOpen) buildLyrics(); }
function buildLyrics() { const body = $('lyricsBody'); body._manual = 0; if (!lyricsData.length) { body.innerHTML = '<div class="empty-hint" style="color:var(--t3)">暂无歌词</div>'; return; } body.innerHTML = lyricsData.map((l,i) => `<div class="ll" data-i="${i}">${escHtml(l.text||'')}</div>`).join(''); lyricsIdx = -1; }
function scrollLyrics(idx) {
  const body = $('lyricsBody');
  const lines = body.querySelectorAll('.ll');
  if (!lines.length) return;
  lines.forEach((el,i) => el.classList.toggle('active', i===idx));
  const a = lines[idx]; if (!a) return;
  if (Date.now() - (body._manual || 0) < 2500) return;  // 用户正手动翻歌词，别抢
  body.scrollTo({ top: Math.max(0, a.offsetTop - body.clientHeight/2 + a.clientHeight/2), behavior: 'smooth' });
}

/* ── 他的驻场：一首歌播 18 秒后，他会对这首歌说一句话（后端按歌缓存） ── */
function scheduleCompanion(cur) {
  clearTimeout(cpTimer); hideCpBubble();
  cpComment = ''; cpSongId = cur ? cur.id : null;
  updateFpCompanion();
  if (!cur) return;
  cpTimer = setTimeout(() => { const c = current(); if (c && c.id === cpSongId && audio && !audio.paused) fetchCompanionComment(c); }, 18000);
}
async function fetchCompanionComment(song, refresh) {
  try {
    const res = await api('POST', '/api/music/companion_comment', { song_id: song.id, name: song.name || '', artist: song.artist || '', refresh: !!refresh });
    if (res && res.comment && cpSongId === song.id) { cpComment = res.comment; showCpBubble(cpComment); updateFpCompanion(); }
  } catch(e){}
}
function showCpBubble(text) { const b = $('cpBubble'); b.textContent = text; b.classList.remove('hidden'); clearTimeout(cpHideTimer); cpHideTimer = setTimeout(hideCpBubble, 30000); }
function hideCpBubble() { $('cpBubble').classList.add('hidden'); clearTimeout(cpHideTimer); }
function updateFpCompanion() { const w = $('fpWhisper'); $('fpWhisperText').textContent = cpComment || '闭上眼睛，把杂音都忘掉，我就在你身边，听你的心跳。'; w.classList.remove('hidden'); }
function onCompanionTap() {
  const b = $('cpBubble');
  if (!b.classList.contains('hidden')) { hideCpBubble(); return; }
  if (cpComment) { showCpBubble(cpComment); return; }
  const c = current();
  if (c && audio && audio.src) { showCpBubble('…'); fetchCompanionComment(c); }
}

  catch(e){ aiPlRegistry = []; }
}
function aiPlEntry(pid) { return aiPlRegistry.find(p => p.playlist_id === pid); }

function switchTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  ['home','playlists','memories','space'].forEach(n => $('panel-'+n).classList.toggle('hidden', n !== tab));

/* ── 首页：问候 + 搜索 + 他想放给你听 + 我们的歌 ── */
function recCardHtml(p) {
  const first = (p.songs && p.songs[0]);
  const cover = (first && first.cover) || '';
  const name = p.name || '未命名';
  return `<div class="rec-card" data-pid="${p.playlist_id}" data-name="${escHtml(name)}">
    ${cover ? `<img class="rec-cover" src="${escHtml(cover)}" alt="" onerror="this.style.visibility='hidden'">` : `<div class="rec-coverph">♪</div>`}
    <div class="rec-name">${escHtml(name)}</div>
    <div class="rec-note">${escHtml(p.note || '为你攒的歌单')}</div>

}
function ourSongRow(s, i) {
  const cnt = parseInt(s.play_count)||1;
  const d = s.first_shared_at ? fmtDate(s.first_shared_at) : '';
  return `<div class="our-row">
    <div class="our-idx">${i+1}</div>
    <img class="our-cover" src="${escHtml(s.cover||'')}" alt="" onerror="this.style.visibility='hidden'">
    <div class="our-info"><div class="our-name">${escHtml(s.name||'未知')}</div><div class="our-sub">${d?'首听 '+d+' · ':''}一起听过 ${cnt} 次</div></div>
    <div class="our-cnt">♥ ${cnt}</div>
  </div>`;
}
async function renderHome() {
  const panel = $('panel-home');
  const h = new Date().getHours();
  const greet = h < 5 ? '夜深了，还不想睡吗' : h < 11 ? '早上好，今天也要好好听歌' : h < 13 ? '中午好，歇一会儿吧' : h < 18 ? '下午好，想一起听点什么' : '晚上好，今天的旋律为你准备好了';
  let html = `
    <div class="greet-bubble"><div class="gb-tx">${greet}</div><div class="gb-sig">—— 你的年上男友 · ${escHtml(aiName)}</div></div>
    <input class="search-input" id="homeSearch" placeholder="搜索歌曲、歌手…">
    <div id="homeSearchResults" class="hidden"></div>
    <div id="homeContent">
      <div id="homeAiPl"></div>
      <div id="homeOurSongs"></div>
    </div>`;
  panel.innerHTML = html;
  const hs = $('homeSearch');
  let hst = null;
  hs.addEventListener('input', () => { clearTimeout(hst); hst = setTimeout(() => doSearch(hs.value), 350); });
  hs.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(hst); doSearch(hs.value); } });
  // 他想放给你听：AI 歌单随机 2 张 + 换一首
  try { await loadAiPlaylists();
    const $h = $('homeAiPl');
    if (!aiPlRegistry.length) { $h.innerHTML = '<div class="empty-hint">他还没给你建过歌单，去聊天里让他建一个吧</div>'; }
    else {
      $h.innerHTML = `<div class="section-row"><div class="section-title">他想放给你听</div><button class="shuffle-link" id="aiPlShuffle">换一首</button></div><div class="rec-cards" id="aiPlCards"></div>`;
      const renderCards = () => {
        const pls = aiPlRegistry.slice().sort(() => Math.random() - 0.5).slice(0, 2);
        $('aiPlCards').innerHTML = pls.map(p => recCardHtml(p)).join('');
        document.querySelectorAll('#aiPlCards .rec-card').forEach(el => { el.onclick = () => { switchTab('playlists'); setTimeout(() => openPlaylist(parseInt(el.dataset.pid), el.dataset.name || ''), 100); }; });
      };
      renderCards();
      $('aiPlShuffle').onclick = renderCards;
    }
  } catch(e){ $('homeAiPl').innerHTML = ''; }
  // 我们的歌：一起听过的歌按播放次数前 5
  try { const res = await api('GET', '/api/music/shared?limit=100'); const songs = (res && res.songs) || [];
    const $o = $('homeOurSongs');
    const ranked = songs.slice().sort((a,b) => (parseInt(b.play_count)||0) - (parseInt(a.play_count)||0)).slice(0,5);
    if (!ranked.length) { $o.innerHTML = '<div class="empty-hint">还没有一起听过的歌，放一首，他就在</div>'; }
    else {
      $o.innerHTML = `<div class="section-title">我们的歌 <span class="cnt-note">共 ${songs.length} 首</span></div>` + ranked.map(ourSongRow).join('');
      const refs = ranked.map(s => ({id: s.song_id, name: s.name, artist: s.artist||'', cover: s.cover||''}));
      refs.forEach(r => songIdx[r.id] = r);
      $o.querySelectorAll('.our-row').forEach((el, i) => el.onclick = () => playNow(refs[i]));
    }
  } catch(e){ $('homeOurSongs').innerHTML = ''; }
}

/* ── 歌单页 ── */
let _favSongs = null;   // 会话内红心缓存
let _plsCache = null;   // 会话内歌单缓存
function favRowHtml(count) {
  return `<div class="fav-card" data-fav="1"><div class="fav-cover">♥</div><div class="fi"><div class="fn">我喜欢的音乐</div><div class="fc" id="favCount">${count == null ? '加载中…' : '♥ ' + count + ' 首'}</div></div><div class="fav-play">▶</div></div>`;
}
function plCardHtml(p, isAi) {
  const e = aiPlEntry(p.id);
  const note = (isAi && e && e.note) ? e.note : '';
  const cnt = isAi ? ((e && e.songs && e.songs.length) || p.track_count || 0) : (p.track_count||0);
  return `<div class="pl-card-row" data-pid="${p.id}" data-name="${escHtml(p.name||'')}">
    <img class="plc-cover" src="${escHtml(p.cover||'')}" alt="" onerror="this.style.visibility='hidden'">
    <div class="plc-info"><div class="plc-name">${escHtml(p.name||'未命名')}${isAi?'<span class="pl-tag ai">他建的</span>':''}</div>${note?`<div class="plc-note">${escHtml(note)}</div>`:''}<div class="plc-meta">${cnt} 首旋律</div></div>
    <div class="plc-play">▶</div>
  </div>`;
}
async function _renderPlList(panel, pls) {
  const ai = pls.filter(p => aiPlEntry(p.id));
  const mine = pls.filter(p => !aiPlEntry(p.id));
  let html = `<div class="pl-note"><img src="/public/AIIcon.png" alt="" onerror="this.style.display='none'"><div class="txt"><b>${escHtml(aiName)} 的专属赠礼</b><div class="pl-note-sub">这些歌单，都是为你一个人攒的。</div></div></div>`;
  html += favRowHtml(_favSongs ? _favSongs.length : null);
  html += `<div class="section-row"><div class="section-title">男友私藏歌单</div><div class="pill-btns"><button class="pill" id="plCreate">+ 创建歌单</button><button class="pill" id="plImport">导入歌单</button></div></div>`;
  html += (ai.length ? ai.map(p => plCardHtml(p, true)).join('') : '<div class="empty-hint">他还没有私藏歌单</div>');
  html += `<div class="section-title">我的歌单</div>` + (mine.length ? mine.map(p => plCardHtml(p, false)).join('') : '<div class="empty-hint">还没有自己的歌单</div>');
  panel.innerHTML = html;
  $('plCreate').onclick = createPlaylist;
  $('plImport').onclick = () => toast('导入歌单功能开发中');
  panel.querySelectorAll('.fav-card').forEach(el => el.onclick = openFavorites);
  panel.querySelectorAll('.pl-card-row').forEach(el => el.onclick = () => openPlaylist(parseInt(el.dataset.pid), el.dataset.name || ''));
  if (_favSongs == null) {
    try { const r = await api('GET', '/api/music/favorites'); _favSongs = (r && r.songs) || []; const fc = $('favCount'); if (fc) fc.textContent = '♥ ' + _favSongs.length + ' 首'; }
    catch(e){ const fc = $('favCount'); if (fc) fc.textContent = '♥ 0 首'; }
  }
}
async function loadPlaylists() { const panel = $('panel-playlists');
  if (_plsCache && _plsCache.length) await _renderPlList(panel, _plsCache);
  else panel.innerHTML = '<div class="empty-hint">加载中…</div>';
  try { const [res] = await Promise.all([api('GET', '/api/music/playlists'), loadAiPlaylists()]);
    const pls = (res && res.playlists) || [];
    if (res && res.error) { if (!_plsCache) panel.innerHTML = '<div class="empty-hint">' + escHtml(res.error) + '</div>'; return; }
    if (!pls.length) { if (!_plsCache) panel.innerHTML = '<div class="empty-hint">还没有歌单，先建一个吧</div>'; return; }
    _plsCache = pls;
    if (curTab === 'playlists' && !panel.querySelector('.pl-back')) await _renderPlList(panel, pls);
  } catch(e) { if (!_plsCache) panel.innerHTML = '<div class="empty-hint">加载失败</div>'; } }
async function createPlaylist() {
  const nm = prompt('给新歌单起个名字：'); if (!nm || !nm.trim()) return;
  try { const r = await api('POST', '/api/music/playlist', { name: nm.trim() });
    if (r && r.ok) { toast('已创建'); _plsCache = null; loadPlaylists(); }
    else toast((r && r.error) || '创建失败');
  } catch(e){ toast('创建失败'); } }
async function openFavorites() { const panel = $('panel-playlists');
  panel.innerHTML = `<div class="pl-back" id="favBack">‹ 返回歌单</div><div class="empty-hint">加载中…</div>`; $('favBack').onclick = loadPlaylists;
  let songs = _favSongs;
  try {
    if (!songs || !songs.length) {
      const res = await api('GET', '/api/music/favorites');
      if (res && res.error) { panel.innerHTML = `<div class="pl-back" id="favBack1">‹ 返回歌单</div><div class="empty-hint">${escHtml(res.error)}</div>`; $('favBack1').onclick = loadPlaylists; return; }
      songs = (res && res.songs) || []; _favSongs = songs;
    }
  } catch(e) { panel.innerHTML = `<div class="pl-back" id="favBack2">‹ 返回歌单</div><div class="empty-hint">加载失败</div>`; $('favBack2').onclick = loadPlaylists; return; }
  if (!songs.length) { panel.innerHTML = `<div class="pl-back" id="favBack3">‹ 返回歌单</div><div class="empty-hint">还没有红心歌曲</div>`; $('favBack3').onclick = loadPlaylists; return; }
  songs.forEach(s => { if (s && s.id != null) likedIds.add(s.id); });
  let html = `<div class="pl-back" id="favBack4">‹ 返回歌单</div><div class="section-title">我喜欢的音乐 <span class="cnt-note">♥ ${songs.length} 首</span></div>`;
  html += `<div class="pl-allbtns"><button id="favAll1">▶ 整单播放</button><button id="favAll2">➕ 加入队列</button></div>`;
  panel.innerHTML = html + songs.map(songRowHtml).join('');
  $('favBack4').onclick = loadPlaylists;
  $('favAll1').onclick = () => enqueue(songs, { play: true });
  $('favAll2').onclick = () => enqueue(songs, { play: false });
  bindSongRows(panel);
}
async function openPlaylist(pid, name) { const panel = $('panel-playlists');
  panel.innerHTML = `<div class="pl-back" id="plBack">‹ 返回歌单</div><div class="empty-hint">加载中…</div>`; $('plBack').onclick = loadPlaylists;
  try { const res = await api('GET', '/api/music/playlist/' + pid); const songs = (res && res.songs) || [];
    if (!aiPlRegistry.length) await loadAiPlaylists();
    const aiEntry = aiPlEntry(pid);
    if (aiEntry) { const noteMap = {}; (aiEntry.songs||[]).forEach(s => { if (s.note) noteMap[s.id] = s.note; }); songs.forEach(s => { if (noteMap[s.id]) s.note = noteMap[s.id]; }); }
    let html = `<div class="pl-back" id="plBack2">‹ 返回歌单</div>`;
    html += `<div class="pl-head"><img class="pl-head-cover" src="${escHtml((songs[0]&&songs[0].cover)||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="pl-head-tx"><div class="pl-head-name">${escHtml(name||'未命名')}${aiEntry?'<span class="pl-tag ai">他建的</span>':''}</div><div class="pl-head-meta">${songs.length} 首旋律</div></div></div>`;
    if (aiEntry && aiEntry.note) html += `<div class="pl-note"><img src="/public/AIIcon.png" alt="" onerror="this.style.display='none'"><div class="txt">${escHtml(aiEntry.note)}</div></div>`;
    if (songs.length) html += `<div class="pl-allbtns"><button id="plPlayAll">▶ 整单播放</button><button id="plAddAll">➕ 加入队列</button></div>`;
    html += (songs.length ? songs.map(songRowHtml).join('') : '<div class="empty-hint">歌单为空</div>');
    panel.innerHTML = html; $('plBack2').onclick = loadPlaylists;
    if (songs.length) { $('plPlayAll').onclick = () => enqueue(songs, { play: true }); $('plAddAll').onclick = () => enqueue(songs, { play: false }); }
    bindSongRows(panel);
  } catch(e) { panel.innerHTML = `<div class="pl-back" id="plBackErr">‹ 返回歌单</div><div class="empty-hint">加载失败</div>`; $('plBackErr').onclick = loadPlaylists; } }
async function doSearch(q) {
  const list = $('homeSearchResults'), content = $('homeContent');
  if (!list) return;
  q = (q||'').trim();
  if (!q) { list.classList.add('hidden'); content.classList.remove('hidden'); return; }
  list.classList.remove('hidden'); content.classList.add('hidden');
  list.innerHTML = '<div class="empty-hint">搜索中…</div>';
  try { const res = await api('GET', '/api/music/search?q=' + encodeURIComponent(q) + '&limit=20'); const songs = (res && res.songs) || [];
    if (($('homeSearch')||{}).value.trim() !== q) return;  // 输入已变化，丢弃过期结果
    if (!songs.length) { list.innerHTML = '<div class="empty-hint">没找到相关歌曲</div>'; return; }
    list.innerHTML = songs.map(songRowHtml).join(''); bindSongRows(list);
  } catch(e) { list.innerHTML = '<div class="empty-hint">搜索失败</div>'; } }

/* ── 回忆页：共同回忆时间线 ── */
function memCardHtml(s) {
  const cnt = parseInt(s.play_count)||1;
  const first = s.first_shared_at ? fmtDate(s.first_shared_at) : '';
  const note = `从${first ? ' ' + first + ' 起' : '那天起'}，这首歌陪我们听了 ${cnt} 次。`;
  return `<div class="mem-card">
    <div class="mem-top"><img class="mem-cover" src="${escHtml(s.cover||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="mem-tx"><div class="mem-name">${escHtml(s.name||'未知')}</div><div class="mem-tag">与你共听记录 · ${cnt} 次</div></div></div>
    <div class="mem-div"></div>
    <div class="mem-sig">${escHtml(aiName)} 的手记 •</div>
    <div class="mem-note">${note}</div>
  </div>`;
}
async function renderMemories() {
  const panel = $('panel-memories');
  panel.innerHTML = `<div class="mem-head"><div class="mem-title">共同回忆</div><div class="mem-sub" id="memSub">加载中…</div></div><div id="memTimeline"></div>`;
  try { const res = await api('GET', '/api/music/shared?limit=100'); const songs = (res && res.songs) || [];
    const totalPlays = songs.reduce((n,s) => n + (parseInt(s.play_count)||1), 0);
    $('memSub').textContent = `这里记录着我们一起共享的 ${Math.round(totalPlays * 3.5)} 分钟乐音日记`;
    const tl = $('memTimeline');
    if (!songs.length) { tl.innerHTML = '<div class="empty-hint">还没有共同回忆，放一首歌，他就在</div>'; return; }
    const groups = {};
    songs.forEach(s => { const d = s.last_played_at ? fmtDate(s.last_played_at) : '未标日期'; (groups[d] = groups[d] || []).push(s); });
    const days = Object.keys(groups).sort((a,b) => a < b ? 1 : -1);
    const refs = [];
    tl.innerHTML = days.map(d => `
      <div class="timeline-day">
        <div class="tl-dot"></div><div class="tl-date">${d}</div>
        ${groups[d].map(s => { refs.push({id: s.song_id, name: s.name, artist: s.artist||'', cover: s.cover||''}); return memCardHtml(s); }).join('')}
      </div>`).join('');
    refs.forEach(r => songIdx[r.id] = r);
    tl.querySelectorAll('.mem-card').forEach((el, i) => el.onclick = () => playNow(refs[i]));
  } catch(e){ $('memTimeline').innerHTML = '<div class="empty-hint">加载失败</div>'; }
}

/* ── 我们页：私密小窝 + 默契共鸣 + 珍藏旋律 ── */
async function renderSpace() {
  const panel = $('panel-space');
  panel.innerHTML = `
    <div class="room-card">
      <div class="room-scene">
        <div class="rs-moon"></div><div class="rs-note n1">♪</div><div class="rs-note n2">♫</div><div class="rs-note n3">♪</div>
        <img class="rs-ai" src="/public/AIIcon.png" alt="" onerror="this.style.visibility='hidden'">
      </div>
      <div class="room-title">我们的私密小窝</div>
      <div class="room-quote">「不管多晚，我都一直守在这里，准备好温热的旋律，静静等你来听。」<div class="room-sig">—— ${escHtml(aiName)}</div></div>
    </div>
    <div class="space-intim">
      <div class="intim-avatars"><img src="/public/UserIcon.png" alt="" onerror="this.style.visibility='hidden'"><div class="intim-heart">❤</div><img src="/public/AIIcon.png" alt="" onerror="this.style.visibility='hidden'"></div>
      <div class="intim-title" id="intimTitle">— 超密契合度</div>
      <div class="intim-sub" id="intimSub">加载中…</div>
    </div>
    <div class="section-title">相框里的珍藏旋律</div>
    <div class="frame-card" id="frameCard"></div>`;
  try { const res = await api('GET', '/api/music/shared?limit=100'); const songs = (res && res.songs) || [];
    const totalPlays = songs.reduce((n,s) => n + (parseInt(s.play_count)||1), 0);
    const totalHours = Math.round(totalPlays * 3.5 / 60);
    const pct = Math.min(99, 55 + Math.min(44, songs.length * 3));
    $('intimTitle').textContent = pct + '% 超密契合度';
    $('intimSub').textContent = songs.length ? `累计共听 ${totalHours} 小时 · 我们一起分享了 ${songs.length} 首歌` : '放一首歌，开始你们的默契';
    const top = songs.slice().sort((a,b) => (parseInt(b.play_count)||0) - (parseInt(a.play_count)||0))[0];
    if (top) { const t = {id: top.song_id, name: top.name, artist: top.artist||'', cover: top.cover||''}; songIdx[t.id] = t;
      $('frameCard').innerHTML = `<div class="frame-inner"><img class="frame-cover" src="${escHtml(t.cover)}" alt="" onerror="this.style.visibility='hidden'"><div class="frame-name">${escHtml(t.name)}</div><div class="frame-sub">${top.first_shared_at?'定情于 '+fmtDate(top.first_shared_at)+' · ':''}${escHtml(aiName)} 特调音色</div></div>`;
      $('frameCard').onclick = () => playNow(t);
    } else $('frameCard').innerHTML = '<div class="empty-hint">还没有珍藏曲</div>';
  } catch(e){ $('frameCard').innerHTML = '<div class="empty-hint">加载失败</div>'; }
}

/* ── 播放队列：底部抽屉（顶栏 🎧 / 全屏 ≡ 呼出） ── */
function qSheetOpen() { return $('qSheet').classList.contains('show'); }
function openQueueSheet() { renderQueue(); $('qSheet').classList.add('show'); }
function closeQueueSheet() { $('qSheet').classList.remove('show'); }
function renderQueue() {
  const list = $('qList');
  $('qTitle').textContent = `当前播放 (${queue.length})`;
  if (!queue.length) { list.innerHTML = '<div class="empty-hint">队列为空，去搜索或歌单里加几首</div>'; return; }
  list.innerHTML = queue.map((s,i) => songRowHtml(s, i, index)).join('');
  list.querySelectorAll('.song-row').forEach((el, i) => {
    const del = document.createElement('button'); del.className = 'btn'; del.textContent = '✕'; del.title = '移除';
    del.onclick = e => { e.stopPropagation(); removeFromQueue(i); };
    el.appendChild(del);
    el.onclick = () => playIndex(i, true);
  });
  bindSongRows(list);
}

/* ── 全屏播放器「今日共听」 ── */
async function updateTodayCount() {
  try { const res = await api('GET', '/api/music/shared?limit=500'); const songs = (res && res.songs) || [];
    const tk = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const tk0 = tk(new Date());
    const todayPlays = songs.filter(s => { const dt = s.last_played_at ? new Date(Math.round(Number(s.last_played_at))*1000) : null; return dt && !isNaN(dt.getTime()) && tk(dt) === tk0; }).reduce((n,s) => n + (parseInt(s.play_count)||0), 0);
    const all = songs.reduce((n,s) => n + (parseInt(s.play_count)||0), 0);
    $('fpTodayCount').textContent = todayPlays ? '今日共听 ' + todayPlays + ' 次' : (all ? '共听 ' + all + ' 次' : '一起听 0 次');
  } catch(e){}
}

/* ── 歌曲行（搜索/歌单/红心/回忆共用） ── */
function songRowHtml(s, i, curIdx) { const liked = likedIds.has(s.id); if (s && s.id != null) songIdx[s.id] = s;
  return `<div class="song-row ${i != null && i === curIdx ? 'cur' : ''}" data-id="${s.id}">
    <img class="cover" src="${escHtml(s.cover||'')}" alt="" onerror="this.style.visibility='hidden'">
    <div class="info"><div class="name">${escHtml(s.name||'未知')}</div><div class="artist">${escHtml(s.artist||'')}</div>${s.note?`<div class="note">💬 ${escHtml(s.note)}</div>`:''}</div>
    <button class="btn like ${liked?'liked':''}" data-act="like">${liked?'♥':'♡'}</button>
    <button class="btn" data-act="add" title="加入队列">➕</button>
    <button class="btn" data-act="play" title="立即播放">▶</button></div>`; }
function bindSongRows(container) { container.querySelectorAll('.song-row').forEach(el => { el.querySelectorAll('button').forEach(b => { b.onclick = e => { e.stopPropagation(); const id = parseInt(el.dataset.id); const song = songIdx[id] || { id, name: '', artist: '', cover: '' };
    if (b.dataset.act === 'like') toggleLike(id, b); else if (b.dataset.act === 'add') enqueue([song], { play: false }); else if (b.dataset.act === 'play') playNow(song); }; }); }); }
function toggleLike(id, btn) { const liked = btn.classList.contains('liked'); const next = !liked;
  api('POST', '/api/music/like/' + id + '?like=' + next).then(r => { if (r && r.ok) { btn.classList.toggle('liked', next); btn.textContent = next?'♥':'♡'; if (next) likedIds.add(id); else likedIds.delete(id); } }).catch(()=>{}); }

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000); }

document.addEventListener('DOMContentLoaded', init);
</script>
