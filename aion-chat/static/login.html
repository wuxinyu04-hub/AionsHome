<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aion · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
    color: #eee;
  }
  .card {
    width: min(320px, 86vw);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 34px 28px 30px;
    backdrop-filter: blur(12px);
    text-align: center;
  }
  .logo { font-size: 40px; margin-bottom: 10px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .hint { font-size: 12px; color: rgba(255,255,255,.45); margin-bottom: 22px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.25); color: #fff; outline: none;
  }
  input:focus { border-color: rgba(120,160,255,.7); }
  button {
    width: 100%; margin-top: 14px; padding: 12px;
    font-size: 15px; font-weight: 600; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #5b7cfa, #7f5bfa); color: #fff;
    cursor: pointer;
  }
  button:active { opacity: .85; }
  .err { color: #ff8a8a; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🏠</div>
    <h1>Aion's Home</h1>
    <div class="hint">密码在电脑的 data/auth_secret.txt 里</div>
    <input type="password" id="pw" placeholder="访问密码" autocomplete="current-password" autofocus>
    <button id="go">进入</button>
    <div class="err" id="err"></div>
  </div>
<script>
  async function login() {
    var pw = document.getElementById("pw").value.trim();
    var err = document.getElementById("err");
    if (!pw) { err.textContent = "请输入密码"; return; }
    err.textContent = "";
    try {
      var r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
      });
      if (r.ok) { location.href = "/"; }
      else { err.textContent = "密码不对"; }
    } catch (e) { err.textContent = "网络错误，请重试"; }
  }
  document.getElementById("go").addEventListener("click", login);
  document.getElementById("pw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") login();
  });
</script>
</body>
</html>
